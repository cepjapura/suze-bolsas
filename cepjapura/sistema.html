<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Suze Bolsas Finance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ─── DESIGN SYSTEM ─── */
/* Dark fintech: deep navy base, electric teal accent, coral danger, mint positive */
:root {
  --bg:       #06080f;
  --bg2:      #0c1020;
  --surface:  #111827;
  --surface2: #1a2235;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);

  --teal:     #00e5cc;
  --teal-dim: rgba(0,229,204,0.12);
  --coral:    #ff5757;
  --coral-dim:rgba(255,87,87,0.12);
  --mint:     #1aff8c;
  --mint-dim: rgba(26,255,140,0.1);
  --gold:     #ffb930;
  --gold-dim: rgba(255,185,48,0.1);
  --purple:   #a78bfa;
  --purple-dim:rgba(167,139,250,0.1);

  --text:     #f0f4ff;
  --text2:    #8896b3;
  --text3:    #4a5568;

  --radius:   14px;
  --radius-sm:8px;
}

/* Single dark theme — committed dark-first design */
:root { color-scheme: dark; }
body { background: var(--bg); color: var(--text); }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  padding-left:  max(0px, env(safe-area-inset-left,  0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* Ambient background glow */
.ambient {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 10%, rgba(0,229,204,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 85% 90%, rgba(167,139,250,0.05) 0%, transparent 60%);
}

/* ─── APP SHELL ─── */
.shell {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-logo {
  padding: 1.75rem 1.5rem 1.25rem;
  border-bottom: 1px solid var(--border);
}

.logo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--teal), #0099ff);
  border-radius: 12px;
  font-size: 20px;
  margin-bottom: 0.75rem;
}

.logo-name {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.logo-name span { color: var(--teal); }

.logo-sub {
  font-size: 0.7rem;
  color: var(--text3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 2px;
}

.sidebar-nav {
  flex: 1;
  padding: 1rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-section-label {
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 0.75rem 0.75rem 0.35rem;
  font-weight: 600;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0.85rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text2);
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.15s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }

.nav-item.active {
  color: var(--teal);
  background: var(--teal-dim);
  font-weight: 600;
}

.nav-item .icon {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
}

.sidebar-footer {
  padding: 1rem 1.25rem;
  border-top: 1px solid var(--border);
}

.sync-status {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: var(--text3);
}

.sync-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text3);
  flex-shrink: 0;
}
.sync-dot.ok { background: var(--mint); box-shadow: 0 0 6px var(--mint); }
.sync-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--coral); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ─── MAIN CONTENT ─── */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* ─── TOP BAR ─── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(6,8,15,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 1.5rem;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.topbar-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.period-selector {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.4rem 0.75rem;
}

.period-selector select {
  background: none;
  border: none;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  outline: none;
  cursor: pointer;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.45rem 1rem;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  transition: all 0.15s;
}

.btn-ghost {
  background: rgba(255,255,255,0.04);
  color: var(--text2);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--text); }

.btn-teal {
  background: var(--teal);
  color: #000;
}
.btn-teal:hover { background: #00ffea; box-shadow: 0 0 20px rgba(0,229,204,0.3); }

/* ─── PAGE CONTENT ─── */
.content {
  flex: 1;
  padding: 1.75rem max(16px, env(safe-area-inset-right, 0px)) 1.75rem 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* ─── SECTIONS ─── */
.section { display: none; }
.section.active { display: contents; }

/* ─── KPI GRID ─── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}

.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  border-radius: 0 2px 2px 0;
}

.kpi.teal::before  { background: var(--teal); }
.kpi.coral::before { background: var(--coral); }
.kpi.mint::before  { background: var(--mint); }
.kpi.gold::before  { background: var(--gold); }
.kpi.purple::before{ background: var(--purple); }

.kpi:hover { border-color: var(--border2); }

.kpi-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text3);
  margin-bottom: 0.6rem;
  font-weight: 600;
}

.kpi-value {
  font-family: 'DM Mono', monospace;
  font-size: 1.6rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  margin-bottom: 0.4rem;
}

.kpi.teal  .kpi-value { color: var(--teal); }
.kpi.coral .kpi-value { color: var(--coral); }
.kpi.mint  .kpi-value { color: var(--mint); }
.kpi.gold  .kpi-value { color: var(--gold); }
.kpi.purple .kpi-value { color: var(--purple); }

.kpi-sub {
  font-size: 0.72rem;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.delta {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
}
.delta.up   { color: var(--mint);  background: var(--mint-dim); }
.delta.down { color: var(--coral); background: var(--coral-dim); }

/* ─── CHART GRID ─── */
.chart-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 1rem;
}

.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}

.chart-title {
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
}

.chart-legend {
  display: flex;
  gap: 1rem;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.72rem;
  color: var(--text2);
}

.legend-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

.chart-wrap {
  position: relative;
  height: 200px;
}

/* ─── COMPARATIVO ─── */
.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}

.compare-month {
  background: var(--bg2);
  border-radius: var(--radius-sm);
  padding: 1rem;
}

.compare-month-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text3);
  margin-bottom: 0.75rem;
  font-weight: 600;
}

.compare-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 0.4rem;
  font-size: 0.8rem;
}

.compare-row .label { color: var(--text2); }
.compare-row .val   { font-family: 'DM Mono', monospace; font-size: 0.78rem; font-variant-numeric: tabular-nums; }

/* ─── META DE GASTOS ─── */
.meta-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
}

.meta-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.meta-title {
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
}

.meta-edit {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8rem;
  color: var(--text2);
}

.meta-edit input[type="number"] {
  width: 100px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.3rem 0.6rem;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  outline: none;
  text-align: right;
}
.meta-edit input[type="number"]:focus { border-color: var(--teal); }

.meta-bar-wrap {
  height: 10px;
  background: var(--bg2);
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 0.6rem;
}

.meta-bar {
  height: 100%;
  border-radius: 5px;
  transition: width 0.6s ease, background 0.3s;
}

.meta-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text3);
  font-family: 'DM Mono', monospace;
}

/* ─── CATEGORIA BARS ─── */
.cat-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.cat-item {
  display: grid;
  grid-template-columns: 110px 1fr auto;
  align-items: center;
  gap: 0.75rem;
}

.cat-name {
  font-size: 0.8rem;
  color: var(--text2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cat-bar-wrap {
  height: 6px;
  background: var(--bg2);
  border-radius: 3px;
  overflow: hidden;
}

.cat-bar {
  height: 100%;
  border-radius: 3px;
  background: var(--teal);
}

.cat-val {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  color: var(--text2);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ─── TABELA ─── */
.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.table-toolbar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.table-toolbar .title {
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  flex: 1;
  min-width: 120px;
}

.search-input {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.4rem 0.75rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  outline: none;
  width: 200px;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--teal); }

.filter-select {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.4rem 0.75rem;
  color: var(--text2);
  font-size: 0.8rem;
  outline: none;
  cursor: pointer;
}
.filter-select option { background: var(--surface); }

.table-wrap { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }

thead th {
  background: var(--bg2);
  padding: 0.6rem 1rem;
  text-align: left;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text3);
  font-weight: 600;
  white-space: nowrap;
}

tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
tbody tr:hover { background: rgba(255,255,255,0.02); }
tbody tr:last-child { border-bottom: none; }

tbody td {
  padding: 0.7rem 1rem;
  font-size: 0.825rem;
  color: var(--text2);
  white-space: nowrap;
}

tbody td.bold { font-weight: 600; color: var(--text); }

.tipo-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
}
.tipo-gasto        { background: var(--coral-dim); color: var(--coral); }
.tipo-entrada      { background: var(--mint-dim);  color: var(--mint); }
.tipo-retirada     { background: var(--gold-dim);  color: var(--gold); }
.tipo-investimento { background: var(--purple-dim); color: var(--purple); }

.table-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 1.25rem;
  border-top: 1px solid var(--border);
  font-size: 0.75rem;
  color: var(--text3);
}

/* ─── FORM ─── */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
}

.field { display: flex; flex-direction: column; gap: 0.4rem; }

.field label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text3);
  font-weight: 600;
}

.field input, .field select, .field textarea {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.6rem 0.9rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); }
.field select option { background: var(--surface); }

.parcelas-preview {
  background: var(--teal-dim);
  border: 1px dashed rgba(0,229,204,0.25);
  border-radius: var(--radius-sm);
  padding: 0.65rem 1rem;
  font-size: 0.8rem;
  color: var(--teal);
  display: none;
  margin-top: 0.25rem;
}
.parcelas-preview.show { display: block; }

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 0.75rem 1.25rem;
  font-size: 0.85rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s;
  z-index: 200;
  pointer-events: none;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { border-left: 3px solid var(--mint); }
.toast.error   { border-left: 3px solid var(--coral); }
.toast.info    { border-left: 3px solid var(--teal); }

/* ─── EMPTY STATE ─── */
.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text3);
}
.empty .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty p { font-size: 0.85rem; }

/* ─── LOADING ─── */
.loading-overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  min-height: 200px;
  color: var(--text3);
  font-size: 0.85rem;
}

.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── PERIODO CUSTOM ─── */
.periodo-range {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.periodo-range input[type="date"] {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.35rem 0.6rem;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  outline: none;
  color-scheme: dark;
}
.periodo-range input[type="date"]:focus { border-color: var(--teal); }

/* ─── PDF PRINT ─── */
@media print {
  .sidebar, .topbar, .btn, .table-toolbar .btn,
  .filter-select, .search-input, .periodo-range { display: none !important; }
  .shell { display: block; }
  .main { width: 100%; }
  .content { padding: 0; }
  body { background: #fff; color: #000; }
}

/* ─── MOBILE ─── */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .chart-grid { grid-template-columns: 1fr; }
  .compare-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .topbar { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
}

@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .content { padding: 1rem max(16px, env(safe-area-inset-right, 0px)) 1rem max(16px, env(safe-area-inset-left, 0px)); }
}
</style>

<div class="ambient"></div>

<div class="shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-badge">👜</div>
      <div class="logo-name">Suze<span>Bolsas</span></div>
      <div class="logo-sub">Controle Financeiro</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Visão Geral</div>
      <button class="nav-item active" onclick="navTo('dashboard',this)">
        <span class="icon">📊</span> Dashboard
      </button>
      <button class="nav-item" onclick="navTo('relatorio',this)">
        <span class="icon">📈</span> Relatórios
      </button>
      <button class="nav-item" onclick="navTo('analise',this)">
        <span class="icon">🔍</span> Análise
      </button>

      <div class="nav-section-label" style="margin-top:0.5rem">Lançamentos</div>

      </button>
      <button class="nav-item" onclick="navTo('novo',this)">
        <span class="icon">➕</span> Novo Lançamento
      </button>

      <div class="sync-status">
        <div class="sync-dot loading" id="sync-dot"></div>
        <span id="sync-label">Conectando...</span>

      <div class="topbar-title" id="page-title">Dashboard</div>

          📅 <select id="mes-sel" onchange="onMesChange()"></select>
        </div>
        <button class="btn btn-ghost" onclick="exportXLSX()">⬇ Excel</button>
        <button class="btn btn-ghost" onclick="exportPDF()">🖨 PDF</button>
        <button class="btn btn-teal" onclick="navTo('novo', document.querySelector('.nav-item:nth-child(7)'))">+ Lançar</button>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ─── FIREBASE CONFIG ───────────────────────────────────────────
const FB_API_KEY   = 'AIzaSyBxDummies_replace_with_real'; // não usado — usamos REST direto
const FB_PROJECT   = 'suze-bolsas';
const FB_SA_EMAIL  = 'firebase-adminsdk-fbsvc@suze-bolsas.iam.gserviceaccount.com';

// ─── CONFIG ───────────────────────────────────────────────────
// OBS: credenciais ficam no servidor (bot.php). Aqui usamos a SDK client do Firebase.
// Substitua as config abaixo pelas suas (Firebase Console > Configurações do Projeto > Seus apps)
const firebaseConfig = {
  apiKey:     "AIzaSyAMJHe81X2Tm0v_8UXiILUuGUjO7WjHFXw",
  authDomain: "suze-bolsas.firebaseapp.com",
  projectId:  "suze-bolsas",
};

// ─── ESTADO ───────────────────────────────────────────────────
let db, allLancs = [], cats = [], filteredLancs = [];
let mesSel = ''; // 'YYYY-MM' ou 'all' ou 'custom'
let dateFrom = '', dateTo = '';
let metaMensal = 0;
let currentSection = 'dashboard';
let charts = {};

// ─── INIT FIREBASE ────────────────────────────────────────────
(function initFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    setSyncStatus('loading', 'Carregando...');
    carregarDados();
  } catch(e) {
    setSyncStatus('error', 'Erro Firebase');
    showToast('Erro ao conectar Firebase: ' + e.message, 'error');
    renderContent();
  }
})();

// ─── CARREGAR DADOS ───────────────────────────────────────────
async function carregarDados() {
  try {
    const snap = await db.collection('dados').doc('principal').get();
    if (snap.exists) {
      const d = snap.data();
      allLancs = (d.lancamentos || []).map(l => ({
        ...l,
        valor: parseFloat(l.valor) || 0,
        id: l.id || Date.now() + Math.random()
      }));
      cats = d.categorias || ['Insumos','Embalagem','Frete','Marketing','Aviamentos','Outros'];
    }
    setSyncStatus('ok', 'Sincronizado');
    initMesSel();
    metaMensal = tryLS('meta_mensal', 0);
    renderContent();
  } catch(e) {
    setSyncStatus('error', 'Falha na conexão');
    showToast('Erro ao carregar: ' + e.message, 'error');
    initMesSel();
    renderContent();
  }
}

async function salvarLancamentos() {
  try {
    await db.collection('dados').doc('principal').update({
      lancamentos: allLancs.map(l => ({...l, valor: l.valor}))
    });
  } catch(e) {
    throw e;
  }
}

// ─── PERÍODO ──────────────────────────────────────────────────
function initMesSel() {
  const sel = document.getElementById('mes-sel');
  const meses = [...new Set(allLancs.map(l => (l.data||'').slice(0,7)))].filter(Boolean).sort().reverse();
  sel.innerHTML = '<option value="all">Todos os períodos</option>';
  meses.forEach(m => {
    const [y,mo] = m.split('-');
    const nomes = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = nomes[+mo] + '/' + y;
    if (!mesSel) { opt.selected = true; mesSel = m; }
    else if (m === mesSel) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.innerHTML += '<option value="custom">Período personalizado...</option>';
}

function onMesChange() {
  const v = document.getElementById('mes-sel').value;
  mesSel = v;
  renderContent();
}

function getLancsFiltrados(section = null) {
  let l = allLancs;
  if (mesSel && mesSel !== 'all' && mesSel !== 'custom') {
    l = l.filter(x => (x.data||'').startsWith(mesSel));
  } else if (mesSel === 'custom' && dateFrom && dateTo) {
    l = l.filter(x => x.data >= dateFrom && x.data <= dateTo);
  }
  return l;
}

// ─── NAVEGAÇÃO ────────────────────────────────────────────────
function navTo(section, btn) {
  currentSection = section;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const titles = {
    dashboard:'Dashboard', relatorio:'Relatórios', analise:'Análise',
    lancamentos:'Extrato', novo:'Novo Lançamento'
  };
  document.getElementById('page-title').textContent = titles[section] || section;
  renderContent();
}

// ─── RENDER PRINCIPAL ─────────────────────────────────────────
function renderContent() {
  destroyCharts();
  const el = document.getElementById('content');
  switch(currentSection) {
    case 'dashboard':   el.innerHTML = renderDashboard(); break;
    case 'relatorio':   el.innerHTML = renderRelatorio(); break;
    case 'analise':     el.innerHTML = renderAnalise(); break;
    case 'lancamentos': el.innerHTML = renderLancamentos(); break;
    case 'novo':        el.innerHTML = renderNovo(); break;
  }
  requestAnimationFrame(() => {
    if (currentSection === 'dashboard') buildChartsDashboard();
    if (currentSection === 'relatorio') buildChartsRelatorio();
    if (currentSection === 'analise')   buildChartsAnalise();
    if (currentSection === 'lancamentos') bindTableSearch();
    if (currentSection === 'novo') bindFormNovo();
  });
}

// ─── DASHBOARD ────────────────────────────────────────────────
function renderDashboard() {
  const lancs = getLancsFiltrados();
  const totais = calcTotais(lancs);
  const saldo = totais.entradas - totais.gastos - totais.retiradas - totais.investimentos;
  const lucro = totais.entradas - totais.gastos - totais.investimentos;

  // Mês anterior para deltas
  let lancsAnt = [];
  if (mesSel && mesSel !== 'all' && mesSel !== 'custom') {
    const [y,m] = mesSel.split('-').map(Number);
    const antDate = new Date(y, m-2, 1);
    const antMes = `${antDate.getFullYear()}-${String(antDate.getMonth()+1).padStart(2,'0')}`;
    lancsAnt = allLancs.filter(l => (l.data||'').startsWith(antMes));
  }
  const totAnt = calcTotais(lancsAnt);
  const saldoAnt = totAnt.entradas - totAnt.gastos - totAnt.retiradas - totAnt.investimentos;

  const meta = tryLS('meta_mensal', 0);
  const metaPct = meta > 0 ? Math.min(100, Math.round(totais.gastos / meta * 100)) : 0;
  const metaColor = metaPct > 90 ? 'var(--coral)' : metaPct > 70 ? 'var(--gold)' : 'var(--mint)';

  const deltaEntrada = pctDelta(totais.entradas, totAnt.entradas);
  const deltaGasto   = pctDelta(totais.gastos, totAnt.gastos);
  const deltaSaldo   = pctDelta(saldo, saldoAnt);

  // Donut de gastos por categoria
  const porCat = {};
  lancs.filter(l=>l.tipo==='gasto').forEach(l => {
    const c = l.cat || 'Outros';
    porCat[c] = (porCat[c]||0) + l.valor;
  });

  // Bar mensal (últimos 6 meses)
  const historico = getHistorico(6);

  return `
  <div class="kpi-grid">
    <div class="kpi teal">
      <div class="kpi-label">💰 Entradas</div>
      <div class="kpi-value">${fmt(totais.entradas)}</div>
      <div class="kpi-sub">${deltaEntrada} vs mês anterior</div>
    </div>
    <div class="kpi coral">
      <div class="kpi-label">💸 Gastos</div>
      <div class="kpi-value">${fmt(totais.gastos)}</div>
      <div class="kpi-sub">${deltaGasto} vs mês anterior</div>
    </div>
    <div class="kpi mint">
      <div class="kpi-label">📈 Lucro Bruto</div>
      <div class="kpi-value">${fmt(lucro)}</div>
      <div class="kpi-sub">${lancs.length} lançamentos</div>
    </div>
    <div class="kpi gold">
      <div class="kpi-label">📥 Retiradas</div>
      <div class="kpi-value">${fmt(totais.retiradas)}</div>
      <div class="kpi-sub">Shopee + outros</div>
    </div>
    <div class="kpi purple">
      <div class="kpi-label">${saldo>=0?'✅':'⚠️'} Saldo</div>
      <div class="kpi-value">${fmt(saldo)}</div>
      <div class="kpi-sub">${deltaSaldo} vs anterior</div>
    </div>
  </div>

  <!-- META DE GASTOS -->
  ${meta > 0 ? `
  <div class="meta-card">
    <div class="meta-header">
      <div class="meta-title">🎯 Meta de Gastos do Mês</div>
      <div class="meta-edit">
        Meta: <input type="number" id="meta-input" value="${meta}" min="0" step="100"
          onchange="saveMeta(this.value)" style="width:110px">
      </div>
    </div>
    <div class="meta-bar-wrap">
      <div class="meta-bar" style="width:${metaPct}%;background:${metaColor}"></div>
    </div>
    <div class="meta-info">
      <span>${fmt(totais.gastos)} gastos</span>
      <span>${metaPct}% da meta (${fmt(meta)})</span>
      <span>${fmt(Math.max(0, meta - totais.gastos))} restante</span>
    </div>
  </div>
  ` : `
  <div class="meta-card" style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
    <div style="flex:1;min-width:200px">
      <div style="font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;margin-bottom:.25rem">🎯 Meta de Gastos</div>
      <div style="font-size:.8rem;color:var(--text3)">Defina uma meta mensal para acompanhar seus gastos</div>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem">
      <input type="number" id="meta-input" placeholder="Ex: 3000" min="0" step="100"
        style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.4rem .75rem;color:var(--text);font-family:'DM Mono',monospace;font-size:.85rem;outline:none;width:130px">
      <button class="btn btn-teal" onclick="saveMeta(document.getElementById('meta-input').value)">Definir</button>
    </div>
  </div>
  `}

  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Entradas vs Gastos — últimos 6 meses</div>
        <div class="chart-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--teal)"></div>Entradas</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--coral)"></div>Gastos</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--mint)"></div>Saldo</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-hist"></canvas></div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Gastos por Categoria</div>
      </div>
      <div class="chart-wrap"><canvas id="chart-cat"></canvas></div>
    </div>
  </div>

  <!-- COMPARATIVO -->
  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">📅 Comparativo — Este mês vs Anterior</div>
    </div>
    <div class="compare-grid">
      <div class="compare-month">
        <div class="compare-month-label">${getMesLabel(mesSel)}</div>
        ${renderCompareRows(totais, saldo)}
      </div>
      <div class="compare-month">
        <div class="compare-month-label">${getMesAntLabel(mesSel)}</div>
        ${renderCompareRows(totAnt, saldoAnt)}
      </div>
    </div>
  </div>

  <!-- ÚLTIMOS LANÇAMENTOS -->
  <div class="table-card">
    <div class="table-toolbar">
      <div class="title">Últimos Lançamentos</div>
    </div>
    <div class="table-wrap">
      ${renderTabelaRows(lancs.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,8), false)}
    </div>
    ${lancs.length > 8 ? `<div class="table-footer"><span>${lancs.length} no total</span><button class="btn btn-ghost" onclick="navTo('lancamentos',null)">Ver todos →</button></div>` : ''}
  </div>`;
}

// ─── RELATÓRIO ────────────────────────────────────────────────
function renderRelatorio() {
  const lancs = getLancsFiltrados();
  const totais = calcTotais(lancs);
  const saldo = totais.entradas - totais.gastos - totais.retiradas - totais.investimentos;
  const lucro = totais.entradas - totais.gastos - totais.investimentos;

  const porCat = {};
  lancs.filter(l=>l.tipo==='gasto').forEach(l => {
    porCat[l.cat||'Outros'] = (porCat[l.cat||'Outros']||0) + l.valor;
  });
  const catSorted = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = catSorted[0]?.[1] || 1;

  const porForma = {};
  lancs.filter(l=>l.tipo==='gasto').forEach(l => {
    porForma[l.forma||'Outros'] = (porForma[l.forma||'Outros']||0) + l.valor;
  });
  const formaSorted = Object.entries(porForma).sort((a,b)=>b[1]-a[1]);
  const maxForma = formaSorted[0]?.[1] || 1;

  return `
  <div class="kpi-grid">
    <div class="kpi teal"><div class="kpi-label">Entradas</div><div class="kpi-value">${fmt(totais.entradas)}</div></div>
    <div class="kpi coral"><div class="kpi-label">Gastos</div><div class="kpi-value">${fmt(totais.gastos)}</div></div>
    <div class="kpi mint"><div class="kpi-label">Lucro Bruto</div><div class="kpi-value">${fmt(lucro)}</div></div>
    <div class="kpi gold"><div class="kpi-label">Retiradas</div><div class="kpi-value">${fmt(totais.retiradas)}</div></div>
    <div class="kpi purple"><div class="kpi-label">Investimentos</div><div class="kpi-value">${fmt(totais.investimentos)}</div></div>
  </div>

  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">Distribuição do Período</div></div>
      <div class="chart-wrap"><canvas id="chart-dist"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">Evolução Mensal</div></div>
      <div class="chart-wrap"><canvas id="chart-evo"></canvas></div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">🏷 Gastos por Categoria</div></div>
      <div class="cat-list" style="margin-top:.5rem">
        ${catSorted.length ? catSorted.map(([cat,val]) => `
          <div class="cat-item">
            <div class="cat-name">${cat}</div>
            <div class="cat-bar-wrap"><div class="cat-bar" style="width:${Math.round(val/maxCat*100)}%"></div></div>
            <div class="cat-val">${fmt(val)}</div>
          </div>`).join('') : '<div style="color:var(--text3);font-size:.8rem">Sem dados</div>'}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">💳 Forma de Pagamento</div></div>
      <div class="cat-list" style="margin-top:.5rem">
        ${formaSorted.length ? formaSorted.map(([forma,val]) => `
          <div class="cat-item">
            <div class="cat-name">${forma}</div>
            <div class="cat-bar-wrap"><div class="cat-bar" style="width:${Math.round(val/maxForma*100)}%;background:var(--purple)"></div></div>
            <div class="cat-val">${fmt(val)}</div>
          </div>`).join('') : '<div style="color:var(--text3);font-size:.8rem">Sem dados</div>'}
      </div>
    </div>
  </div>`;
}

// ─── ANÁLISE ──────────────────────────────────────────────────
function renderAnalise() {
  const lancs = getLancsFiltrados();
  const historico = getHistorico(12);

  // Top gastos individuais
  const topGastos = lancs.filter(l=>l.tipo==='gasto').sort((a,b)=>b.valor-a.valor).slice(0,5);

  // Ticket médio por categoria
  const catStats = {};
  lancs.filter(l=>l.tipo==='gasto').forEach(l => {
    const c = l.cat||'Outros';
    if (!catStats[c]) catStats[c] = {total:0, count:0};
    catStats[c].total += l.valor;
    catStats[c].count++;
  });

  return `
  <div class="chart-card" style="grid-column:1/-1">
    <div class="chart-header">
      <div class="chart-title">📊 Evolução 12 meses — Entradas · Gastos · Saldo</div>
    </div>
    <div style="height:240px"><canvas id="chart-12m"></canvas></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">🔥 Top 5 Maiores Gastos</div></div>
      <div class="cat-list" style="margin-top:.5rem">
        ${topGastos.length ? topGastos.map((l,i) => `
          <div class="cat-item">
            <div class="cat-name" style="color:var(--text)">#${i+1} ${l.desc||'—'}</div>
            <div class="cat-bar-wrap"><div class="cat-bar" style="width:${Math.round(l.valor/topGastos[0].valor*100)}%;background:var(--coral)"></div></div>
            <div class="cat-val" style="color:var(--coral)">${fmt(l.valor)}</div>
          </div>`).join('') : '<div style="color:var(--text3);font-size:.8rem">Sem dados</div>'}
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">📐 Ticket Médio por Categoria</div></div>
      <div class="cat-list" style="margin-top:.5rem">
        ${Object.entries(catStats).length ? Object.entries(catStats).sort((a,b)=>b[1].total-a[1].total).map(([cat,s]) => `
          <div class="cat-item">
            <div class="cat-name">${cat} <span style="color:var(--text3);font-size:.7rem">(${s.count}×)</span></div>
            <div class="cat-bar-wrap"><div class="cat-bar" style="width:${Math.round(s.total/Object.values(catStats).reduce((a,b)=>a+(b.total),0)*100)}%;background:var(--gold)"></div></div>
            <div class="cat-val" style="color:var(--gold)">${fmt(s.total/s.count)}</div>
          </div>`).join('') : '<div style="color:var(--text3);font-size:.8rem">Sem dados</div>'}
      </div>
    </div>
  </div>`;
}

// ─── EXTRATO ──────────────────────────────────────────────────
function renderLancamentos() {
  const lancs = getLancsFiltrados().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  return `
  <div class="table-card">
    <div class="table-toolbar">
      <div class="title">Extrato Completo</div>
      <input type="text" class="search-input" id="table-search" placeholder="🔍 Buscar..." oninput="filterTable()">
      <select class="filter-select" id="filter-tipo" onchange="filterTable()">
        <option value="">Todos os tipos</option>
        <option>gasto</option><option>entrada</option><option>retirada</option><option>investimento</option>
      </select>
      <select class="filter-select" id="filter-cat" onchange="filterTable()">
        <option value="">Todas as categorias</option>
        ${cats.map(c=>`<option>${c}</option>`).join('')}
      </select>
      <button class="btn btn-ghost" onclick="exportXLSX()">⬇ Excel</button>
    </div>
    <div class="table-wrap" id="table-body">
      ${renderTabelaRows(lancs, true)}
    </div>
    <div class="table-footer">
      <span id="table-count">${lancs.length} lançamentos</span>
      <span>${fmt(lancs.reduce((s,l)=>s+(l.tipo==='entrada'?l.valor:0),0))} entradas · ${fmt(lancs.reduce((s,l)=>s+(l.tipo==='gasto'?l.valor:0),0))} gastos</span>
    </div>
  </div>`;
}

function renderTabelaRows(lancs, withDel) {
  if (!lancs.length) return '<div class="empty"><div class="icon">📭</div><p>Nenhum lançamento encontrado</p></div>';
  return `<table><thead><tr>
    <th>Data</th><th>Descrição</th><th>Tipo</th><th>Categoria</th><th>Forma</th>
    <th style="text-align:right">Valor</th>${withDel?'<th></th>':''}
  </tr></thead><tbody>
  ${lancs.map(l=>`<tr data-id="${l.id}">
    <td class="bold" style="font-family:'DM Mono',monospace;font-size:.78rem">${fmtData(l.data)}</td>
    <td class="bold" style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${l.desc||'—'}</td>
    <td><span class="tipo-badge tipo-${l.tipo||'gasto'}">${tipoLabel(l.tipo)}</span></td>
    <td>${l.cat||'—'}</td>
    <td style="font-size:.78rem">${l.forma||'—'}</td>
    <td class="bold" style="text-align:right;font-family:'DM Mono',monospace;color:${l.tipo==='entrada'?'var(--mint)':l.tipo==='gasto'?'var(--coral)':l.tipo==='retirada'?'var(--gold)':'var(--purple)'}">${fmt(l.valor)}</td>
    ${withDel?`<td><button onclick="delLanc('${l.id}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px" title="Excluir">🗑</button></td>`:''}
  </tr>`).join('')}</tbody></table>`;
}

function bindTableSearch() {
  filteredLancs = getLancsFiltrados().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}

function filterTable() {
  const q    = (document.getElementById('table-search')?.value||'').toLowerCase();
  const tipo = document.getElementById('filter-tipo')?.value || '';
  const cat  = document.getElementById('filter-cat')?.value || '';
  let lancs  = getLancsFiltrados().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if (q)    lancs = lancs.filter(l=>(l.desc||'').toLowerCase().includes(q)||(l.cat||'').toLowerCase().includes(q)||(l.forma||'').toLowerCase().includes(q));
  if (tipo) lancs = lancs.filter(l=>l.tipo===tipo);
  if (cat)  lancs = lancs.filter(l=>(l.cat||'')=== cat);
  document.getElementById('table-body').innerHTML = renderTabelaRows(lancs, true);
  document.getElementById('table-count').textContent = lancs.length + ' lançamentos';
}

async function delLanc(id) {
  if (!confirm('Excluir este lançamento?')) return;
  const idx = allLancs.findIndex(l => String(l.id) === String(id));
  if (idx < 0) return;
  allLancs.splice(idx, 1);
  try {
    await salvarLancamentos();
    showToast('Lançamento excluído', 'success');
    renderContent();
  } catch(e) {
    showToast('Erro ao excluir: ' + e.message, 'error');
  }
}

// ─── NOVO LANÇAMENTO ──────────────────────────────────────────
function renderNovo() {
  const hoje = new Date().toISOString().slice(0,10);
  return `
  <div class="chart-card" style="max-width:700px">
    <div style="font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:1.5rem">➕ Novo Lançamento</div>
    <form id="form-novo" onsubmit="submitNovo(event)">
      <div class="form-grid">
        <div class="field">
          <label>Tipo</label>
          <select id="f-tipo" required onchange="onTipoChange()">
            <option value="gasto">💸 Gasto</option>
            <option value="entrada">💰 Entrada</option>
            <option value="retirada">📥 Retirada</option>
            <option value="investimento">🏭 Investimento</option>
          </select>
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="f-data" value="${hoje}" required>
        </div>
        <div class="field" style="grid-column:1/-1">
          <label>Descrição</label>
          <input type="text" id="f-desc" placeholder="Ex: Compra de insumos — Armarinho" required>
        </div>
        <div class="field">
          <label>Categoria</label>
          <select id="f-cat">
            <option value="">Sem categoria</option>
            ${cats.map(c=>`<option>${c}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Forma de Pagamento</label>
          <select id="f-forma">
            <option>À Vista</option><option>Pix</option><option>Cartão</option>
            <option>Débito</option><option>Boleto</option><option>Transferência</option><option>Dinheiro</option>
          </select>
        </div>
        <div class="field">
          <label>Valor Total (R$)</label>
          <input type="number" id="f-valor" step="0.01" min="0.01" placeholder="0,00" required oninput="onValorChange()">
        </div>
        <div class="field">
          <label>Parcelas</label>
          <select id="f-parcelas" onchange="onValorChange()">
            ${[1,2,3,4,5,6,8,10,12].map(n=>`<option value="${n}">${n}x</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="parcelas-preview" id="parc-prev"></div>
      <div style="display:flex;gap:.75rem;margin-top:1.25rem;flex-wrap:wrap">
        <button type="submit" class="btn btn-teal">✅ Salvar Lançamento</button>
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('form-novo').reset();document.getElementById('parc-prev').classList.remove('show')">Limpar</button>
      </div>
    </form>
  </div>`;
}

function onTipoChange() {
  const tipo = document.getElementById('f-tipo')?.value;
  const catField = document.getElementById('f-cat')?.closest('.field');
  if (catField) catField.style.display = tipo === 'gasto' || tipo === 'investimento' ? '' : 'none';
}

function onValorChange() {
  const v = parseFloat(document.getElementById('f-valor')?.value)||0;
  const p = parseInt(document.getElementById('f-parcelas')?.value)||1;
  const prev = document.getElementById('parc-prev');
  if (prev) {
    if (p > 1 && v > 0) {
      prev.textContent = `${p}× de ${fmt(v/p)} (total ${fmt(v)})`;
      prev.classList.add('show');
    } else {
      prev.classList.remove('show');
    }
  }
}

function bindFormNovo() { onTipoChange(); }

async function submitNovo(e) {
  e.preventDefault();
  const tipo    = document.getElementById('f-tipo').value;
  const data    = document.getElementById('f-data').value;
  const desc    = document.getElementById('f-desc').value.trim().toUpperCase();
  const cat     = document.getElementById('f-cat').value;
  const forma   = document.getElementById('f-forma').value;
  const valor   = parseFloat(document.getElementById('f-valor').value);
  const parcelas= parseInt(document.getElementById('f-parcelas').value)||1;

  if (!valor || valor <= 0) { showToast('Valor inválido', 'error'); return; }

  const baseId = Date.now();
  const vp = Math.round(valor / parcelas * 100) / 100;
  const grupo = parcelas > 1 ? baseId : null;
  const novos = [];

  for (let i = 0; i < parcelas; i++) {
    const d = new Date(data + 'T12:00:00');
    d.setMonth(d.getMonth() + i);
    novos.push({
      id: baseId + i,
      data: d.toISOString().slice(0,10),
      tipo, desc, cat, forma,
      valor: vp,
      numParcela: i+1,
      totalParcelas: parcelas,
      obs: '',
      grupoId: grupo,
    });
  }

  allLancs = allLancs.concat(novos);
  try {
    await salvarLancamentos();
    showToast(parcelas > 1 ? `✅ ${parcelas} parcelas lançadas!` : '✅ Lançamento salvo!', 'success');
    initMesSel();
    mesSel = data.slice(0,7);
    document.getElementById('mes-sel').value = mesSel;
    navTo('dashboard', document.querySelector('.nav-item'));
  } catch(e) {
    allLancs = allLancs.slice(0, -novos.length);
    showToast('Erro ao salvar: ' + e.message, 'error');
  }
}

// ─── HELPERS ──────────────────────────────────────────────────
function calcTotais(lancs) {
  return lancs.reduce((t,l) => {
    const v = l.valor||0;
    if (l.tipo==='entrada')      t.entradas     += v;
    else if (l.tipo==='gasto')   t.gastos        += v;
    else if (l.tipo==='retirada') t.retiradas    += v;
    else if (l.tipo==='investimento') t.investimentos += v;
    return t;
  }, {entradas:0, gastos:0, retiradas:0, investimentos:0});
}

function getHistorico(n) {
  const hoje = new Date();
  const result = [];
  for (let i = n-1; i >= 0; i--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
    const pref = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const lancs = allLancs.filter(l=>(l.data||'').startsWith(pref));
    const t = calcTotais(lancs);
    const nomes = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    result.push({ label: nomes[d.getMonth()+1]+'/'+String(d.getFullYear()).slice(2), ...t, saldo: t.entradas - t.gastos - t.retiradas - t.investimentos });
  }
  return result;
}

function fmt(v) {
  return 'R$ ' + (v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function numFmt(v) {
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(1)+'k';
  return v.toFixed(0);
}
function fmtData(d) {
  if (!d) return '—';
  const [y,m,dia] = d.split('-');
  return `${dia}/${m}/${y}`;
}
function tipoLabel(t) {
  return {gasto:'💸 Gasto',entrada:'💰 Entrada',retirada:'📥 Retirada',investimento:'🏭 Invest.'}[t]||t;
}
function pctDelta(a, b) {
  if (!b) return '<span class="delta up">↑ novo</span>';
  const pct = Math.round((a-b)/b*100);
  const cls = pct >= 0 ? 'up' : 'down';
  const arrow = pct >= 0 ? '↑' : '↓';
  return `<span class="delta ${cls}">${arrow} ${Math.abs(pct)}%</span>`;
}
function getMesLabel(mes) {
  if (!mes || mes==='all') return 'Período selecionado';
  const [y,m] = mes.split('-');
  const nomes = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return nomes[+m] + ' ' + y;
}
function getMesAntLabel(mes) {
  if (!mes || mes==='all') return 'Mês anterior';
  const [y,m] = mes.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  const nomes = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return nomes[d.getMonth()+1] + ' ' + d.getFullYear();
}
function renderCompareRows(totais, saldo) {
  const rows = [
    ['💰 Entradas', totais.entradas, 'var(--mint)'],
    ['💸 Gastos',   totais.gastos,   'var(--coral)'],
    ['📥 Retiradas',totais.retiradas,'var(--gold)'],
    ['📈 Saldo',    saldo,           saldo>=0?'var(--mint)':'var(--coral)'],
  ];
  return rows.map(([l,v,c])=>`<div class="compare-row"><span class="label">${l}</span><span class="val" style="color:${c}">${fmt(v)}</span></div>`).join('');
}
function tryLS(key, def) {
  try { const v = localStorage.getItem(key); return v != null ? JSON.parse(v) : def; } catch{return def;}
}
function setSyncStatus(state, label) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  if (dot) { dot.className = 'sync-dot ' + state; }
  if (lbl) lbl.textContent = label;
}
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.classList.remove('show'), 3500);
}
function saveMeta(v) {
  const val = parseFloat(v)||0;
  try { localStorage.setItem('meta_mensal', JSON.stringify(val)); } catch{}
  showToast(val > 0 ? `Meta definida: ${fmt(val)}` : 'Meta removida', 'success');
  renderContent();
}

// ─── EXPORT ───────────────────────────────────────────────────
function exportXLSX() {
  const lancs = getLancsFiltrados().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if (!lancs.length) { showToast('Nenhum dado para exportar', 'error'); return; }
  const rows = lancs.map(l=>({
    Data: fmtData(l.data), Descrição: l.desc, Tipo: l.tipo,
    Categoria: l.cat||'', Forma: l.forma||'', 'Valor (R$)': l.valor,
    Parcela: l.numParcela||1, 'Total Parc.': l.totalParcelas||1
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Lançamentos');
  XLSX.writeFile(wb, `suze-bolsas-${mesSel||'completo'}.xlsx`);
  showToast('Excel exportado!', 'success');
}

function exportPDF() {
  showToast('Abrindo para impressão / PDF...', 'info');
  setTimeout(() => window.print(), 400);
}
